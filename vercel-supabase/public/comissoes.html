<!doctype html>
<html lang="pt">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comissões · RH Viatel Viseu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="commissions.css">
<header class="portal-header">
 <a href="mapa-recursos-humanos.html"><img src="viatel.svg" alt="Viatel" width="90" height="32"><span>Portal RH</span></a>
 <strong>Comissões</strong>
 <div class="account-actions"><button id="passwordOpen" type="button" aria-haspopup="dialog" hidden>Alterar password</button><button id="logout" type="button" hidden>Terminar sessão</button></div>
</header>
<main class="portal-main">
 <p id="status" role="status" aria-live="polite">A carregar…</p>
 <form id="login" hidden><label>Email<input id="email" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email" enterkeyhint="next" required></label><label>Password<input id="password" type="password" autocomplete="current-password" enterkeyhint="go" required></label><button id="loginSubmit" type="submit">Entrar</button></form>
 <section id="admin" class="import-band" hidden>
  <button id="syncOpen" type="button">Sincronizar pagamentos</button>
  <section id="syncPanel" hidden aria-labelledby="syncTitle">
   <div class="sync-heading"><h2 id="syncTitle">Mapas Excel</h2><button id="syncClose" type="button">Fechar</button></div>
   <input id="syncFolder" type="file" webkitdirectory multiple hidden>
   <button id="syncChoose" type="button">Escolher pasta</button>
   <div id="syncPeriods"></div>
   <label id="syncCoordinatorWrap" hidden>Coordenação<select id="syncCoordinator"></select></label>
   <p id="syncStatus" role="status" aria-live="polite"></p>
   <button id="syncPrepare" type="button">Conferir meses selecionados</button>
  </section>
  <details><summary>Importar histórico JSON e associar acessos</summary><input id="importFile" type="file" accept=".json"></details>
  <section id="importReview" hidden aria-labelledby="importTitle"><h2 id="importTitle">Conferir importação</h2><div id="importSummary"></div><p id="importWarning"></p><div id="mapping"></div><button id="importSave" type="button" hidden>Confirmar associações e importar</button></section>
 </section>
 <section id="app" hidden>
  <div class="report-toolbar"><label>Pesquisar equipa ou pessoa<input id="reportSearch" type="search" placeholder="Nome…" autocomplete="off"></label><label>Relatório<select id="reportScope"></select></label><button id="reload" type="button">Atualizar</button></div>
  <iframe id="reportFrame" title="Histórico de comissões" sandbox="allow-scripts allow-downloads allow-modals" referrerpolicy="no-referrer" hidden></iframe>
 </section>
</main>
<div id="passwordBackdrop" hidden></div>
<dialog id="passwordDialog" aria-labelledby="passwordTitle" aria-modal="true" hidden>
 <h2 id="passwordTitle">Alterar password</h2>
 <form id="passwordForm">
  <label>Nova password<input id="newPassword" name="new-password" type="password" autocomplete="new-password" minlength="12" required></label>
  <label>Confirmar password<input id="confirmPassword" name="confirm-password" type="password" autocomplete="new-password" minlength="12" required></label>
  <p id="passwordStatus" role="status" aria-live="polite"></p>
  <div class="actions">
   <button id="passwordClose" type="button">Fechar</button>
   <button id="passwordSave" type="submit">Guardar password</button>
  </div>
 </form>
</dialog>
<script src="commission-model.js"></script>
<script src="commission-sync.js"></script>
<script src="comissoes.js"></script>
</html>
