<!doctype html>
<html lang="pt">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comissões · RH Viatel Viseu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#f1f5f8;color:#17354b;font:16px/1.5 Arial}main{max-width:1050px;margin:auto;padding:20px}header{background:#082b83;color:white;padding:20px}header a{color:white}button,select,input{padding:12px;margin:6px;border:1px solid #bdcbd8;border-radius:8px;max-width:100%}button{cursor:pointer;background:#007d86;color:white}article,details{background:white;padding:18px;margin:14px 0;border-radius:12px}summary{cursor:pointer;font-weight:bold}h2{color:#007d86}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow:auto}[hidden]{display:none!important}.error{color:#a22}.summary{padding:20px;background:#082b83;color:white;border-radius:12px;font-size:1.2rem}main{box-sizing:border-box}label{display:inline-block}input[type=search]{min-width:250px}summary{overflow-wrap:anywhere}header h1{margin:12px 0}button:hover{background:#005f67}button:disabled{opacity:.5}input:focus,select:focus,button:focus{outline:3px solid #ffc700}@media(max-width:600px){main{padding:12px}article,details{padding:12px}label{display:block}select,input[type=search]{box-sizing:border-box;width:calc(100% - 12px)}h1{font-size:1.7rem}h2{font-size:1.25rem}td,th{padding:6px;font-size:14px}}
#passwordDialog{box-sizing:border-box;width:min(440px,calc(100% - 24px));padding:24px;border:1px solid #bdcbd8;border-radius:8px;background:#fff;color:#17354b}
#passwordDialog::backdrop{background:rgba(10,20,30,.5)}
#passwordDialog h2{margin:0 0 20px}#passwordForm{display:grid;gap:16px}#passwordForm label{display:grid;gap:6px}
#passwordForm input{box-sizing:border-box;width:100%;margin:0}#passwordForm .actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
#passwordForm button{margin:0}#passwordStatus{min-height:1.5em;margin:0;overflow-wrap:anywhere}.success{color:#007d86}
</style>
<header>
 <a href="mapa-recursos-humanos.html">← Portal RH</a>
 <h1>💶 Comissões</h1>
 <button id="passwordOpen" type="button" aria-haspopup="dialog" hidden>Alterar password</button>
 <button id="logout">Terminar sessão</button>
</header>
<main>
 <p id="status" role="status">A carregar…</p>
 <form id="login" hidden>
  <input id="email" type="email" autocomplete="username" placeholder="Email" required>
  <input id="password" type="password" autocomplete="current-password" placeholder="Palavra-passe" required>
  <button>Entrar</button>
 </form>
 <section id="app" hidden>
  <label>Mês <select id="period"></select></label>
  <label>Pessoa <select id="person"></select></label>
  <input id="search" type="search" placeholder="Pesquisar cliente, NIF ou serviço">
  <button id="export">Exportar pessoa · HTML</button>
  <p id="summary" class="summary"></p>
  <div id="reports"></div>
 </section>
 <section id="admin" hidden>
  <details>
   <summary>Importar mapas e associar acessos</summary>
   <p>Selecione o ficheiro de importação preparado a partir dos mapas. Confirme a pessoa RH correspondente a cada NIF antes de gravar.</p>
   <input id="importFile" type="file" accept=".json">
   <div id="mapping"></div>
   <button id="importSave" hidden>Confirmar associações e importar</button>
  </details>
 </section>
</main>
<dialog id="passwordDialog" aria-labelledby="passwordTitle">
 <h2 id="passwordTitle">Alterar password</h2>
 <form id="passwordForm">
  <label>Nova password<input id="newPassword" name="new-password" type="password" autocomplete="new-password" minlength="12" required></label>
  <label>Confirmar password<input id="confirmPassword" name="confirm-password" type="password" autocomplete="new-password" minlength="12" required></label>
  <p id="passwordStatus" role="status" aria-live="polite"></p>
  <div class="actions">
   <button id="passwordClose" type="button">Fechar</button>
   <button id="passwordSave" type="submit">Guardar password</button>
  </div>
 </form>
</dialog>
<script src="commission-model.js"></script>
<script src="comissoes.js"></script>
</html>
